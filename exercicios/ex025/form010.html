<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iano">Em que ano você nasceu?</label>
            <input type="number" id="iano" name="ano" min="1900" max="2026" oninput="calIdade()" required>
        </p>

        <p>
            <label for="iidade">Sua idade:</label>
            <output id="iidade" name="idade">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calIdade() {
            var ano = Number(iano.value);
            var idade = 2026 - ano;
            iidade.innerHTML = idade;
        }
    </script>
</body>
</html>
