<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Formulário</title>
    <style>
        /* Centraliza o formulário e define largura máxima */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        form {
            max-width: 500px;
            margin: 0 auto;
            padding: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #f9f9f9;
        }
        fieldset {
            border: none;
            padding: 0;
            margin: 0;
        }
        label {
            display: block;
            margin-bottom: .25rem;
        }
        input[type=text],
        input[type=email],
        input[type=tel] {
            width: 100%;
            padding: .5rem;
            margin-bottom: 1rem;
            border: 1px solid #aaa;
            border-radius: 3px;
            box-sizing: border-box;
        }
        input[type=submit],
        input[type=reset] {
            padding: .5rem 1rem;
            margin-right: .5rem;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        input[type=submit] { background: #4CAF50; color: white; }
        input[type=reset] { background: #f44336; color: white; }
        @media (max-width: 600px) {
            body { padding: .5rem; }
            input[type=submit], input[type=reset] { width: 100%; margin-bottom: .5rem; }
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" required minlength="2" maxlength="30" size="20" placeholder="Digite seu nome completo" autocomplete="name">
            </p>
            <p>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" required placeholder="Digite seu e-mail" autocomplete="email">
            </p>
            <p>
                <label for="itelefone">Telefone</label>
                <input type="tel" name="telefone" id="itelefone" required placeholder="Digite seu telefone" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$">
            </p>
        </fieldset>
        <!-- Estudar mais sobre RegEx -->
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
